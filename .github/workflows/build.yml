name: Build APK from zip
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q "$(ls *.zip | head -1)"
          P=$(dirname "$(find . -name project.godot | head -1)")
          echo "PROJ=$P" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot and templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.zip
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Keystore and settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          S=~/.config/godot/editor_settings-4.3.tres
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$S"
          cp "$S" ~/.config/godot/editor_settings-4.tres
      - name: Import
        working-directory: ${{ env.PROJ }}
        run: |
          godot --headless --editor --quit || true
          godot --headless --editor --quit || true
      - name: Export APK
        working-directory: ${{ env.PROJ }}
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/MvFreeRide.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MvFreeRide-apk
          path: ${{ env.PROJ }}/build/android/MvFreeRide.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MvFreeRide (последняя сборка)
          prerelease: true
          files: ${{ env.PROJ }}/build/android/MvFreeRide.apk
